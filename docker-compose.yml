version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: railsync-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: railsync
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d railsync"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: railsync-backend
    restart: always
    environment:
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/railsync?schema=public"
      PORT: 4000
      JWT_SECRET: "railsync_super_secure_jwt_secret_key_2026_sih"
      NODE_ENV: production
      UPLOAD_DIR: "/app/uploads"
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: railsync-frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  uploads_data:
