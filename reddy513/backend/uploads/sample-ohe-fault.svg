  <text x="300" y="60" fill="#fbbf24" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle">OHE: Dropper Slack &amp; Flashover Warning</text>
  <text x="300" y="320" fill="#94a3b8" font-family="sans-serif" font-size="14" text-anchor="middle">Mast #144/22 • Khammam–Vijayawada Jn</text>
